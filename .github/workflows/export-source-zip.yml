name: Export NetWave Android source ZIP

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify source files exist
        run: |
          test -f "NetWave-Android-Update-v8-MP4-Fix 2.zip"
          test -f "netwave_icon.png"

      - uses: actions/upload-artifact@v4
        with:
          name: NetWave-Android-Source-and-Icon
          path: |
            NetWave-Android-Update-v8-MP4-Fix 2.zip
            netwave_icon.png
          retention-days: 1
