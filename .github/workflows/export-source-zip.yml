name: Export Android source ZIP

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: SocialHub-Android-Letest
          path: SocialHub-Android-Letest.zip
          retention-days: 1
